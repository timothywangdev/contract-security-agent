[project]
name = "vuln-pipeline"
version = "0.2.1"
description = "Agent-driven security pipelines: execution-verified vulnerability discovery for C/C++ and Solidity targets, and log-based detection and response"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vuln-pipeline = "harness.cli:main"
dnr-pipeline = "dnr_harness.cli:main"
csa = "contract_security_agent.cli:main"
contract-security-agent = "contract_security_agent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*", "dnr_harness*", "contract_security_agent*"]
